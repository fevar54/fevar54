name: Refresh avatar (Scan Matrix)

# Regenera avatar.svg desde la foto de perfil ACTUAL cada 6h y a demanda.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-avatar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet fonttools brotli

      - name: Regenerar avatar.svg
        env:
          AVATAR_USER: ${{ github.repository_owner }}
        run: python scripts/gen_avatar.py

      - name: Commit si cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avatar.svg
          if git diff --staged --quiet; then
            echo "Sin cambios en la foto."
          else
            git commit -m "chore: refrescar avatar Scan Matrix desde la foto de perfil actual"
            git push
          fi
